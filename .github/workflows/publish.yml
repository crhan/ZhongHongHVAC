name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    env:
      # secrets are not available in `if` conditions; route through env instead
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .
          python -m pytest tests -q

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version="$(python -c 'from zhong_hong_hvac.version import __version__; print(__version__)')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::package version ${pkg_version} does not match tag ${tag_version}"
            exit 1
          fi

      - name: Publish to PyPI (API token)
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_PYPI_TOKEN == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          token: ${{ secrets.PYPI_TOKEN }}

      - name: Publish to PyPI (trusted publishing)
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_PYPI_TOKEN == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
